<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Custom To-Do Bot</title>
<style>
  :root {
    --bg: #0f1115;
    --panel: #171a21;
    --border: #2a2e38;
    --text: #e6e8ec;
    --muted: #8b90a0;
    --accent: #5b8cff;
    --bubble-user: #5b8cff;
    --bubble-bot: #232733;
    --danger: #e5534b;
    --ok: #3fb950;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
    height: 100vh;
    display: flex;
  }
  .panel {
    display: flex;
    flex-direction: column;
    height: 100vh;
  }
  .chat-panel {
    flex: 1.3;
    border-right: 1px solid var(--border);
  }
  .task-panel {
    flex: 1;
    background: var(--panel);
  }
  header {
    padding: 14px 18px;
    border-bottom: 1px solid var(--border);
    font-weight: 600;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  header .sub { font-weight: 400; color: var(--muted); font-size: 12px; }
  header #rename { margin-left: 10px; font-weight: 400; }
  #log {
    flex: 1;
    overflow-y: auto;
    padding: 16px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .msg {
    max-width: 75%;
    padding: 10px 13px;
    border-radius: 12px;
    line-height: 1.4;
    white-space: pre-wrap;
    font-size: 14px;
  }
  .msg.user {
    align-self: flex-end;
    background: var(--bubble-user);
    color: white;
    border-bottom-right-radius: 3px;
  }
  .msg.bot {
    align-self: flex-start;
    background: var(--bubble-bot);
    border-bottom-left-radius: 3px;
  }
  .msg.bot .intent {
    display: block;
    margin-top: 6px;
    font-size: 11px;
    color: var(--muted);
  }
  form#chat-form {
    display: flex;
    gap: 8px;
    padding: 14px;
    border-top: 1px solid var(--border);
  }
  input[type="text"] {
    flex: 1;
    background: var(--panel);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 10px 12px;
    border-radius: 8px;
    font-size: 14px;
  }
  input[type="text"]:focus { outline: 1px solid var(--accent); }
  button {
    background: var(--accent);
    color: white;
    border: none;
    padding: 10px 16px;
    border-radius: 8px;
    cursor: pointer;
    font-size: 14px;
  }
  button:hover { opacity: 0.9; }
  button.ghost {
    background: transparent;
    border: 1px solid var(--border);
    color: var(--muted);
    padding: 4px 8px;
    font-size: 12px;
  }
  .examples {
    padding: 0 14px 10px;
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
  }
  .examples button {
    background: var(--panel);
    border: 1px solid var(--border);
    color: var(--muted);
    font-size: 12px;
    padding: 6px 10px;
  }
  #tasks {
    flex: 1;
    overflow-y: auto;
    padding: 12px;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .task {
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 10px 12px;
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 8px;
  }
  .task.completed { opacity: 0.55; }
  .task .title {
    font-size: 14px;
    font-weight: 500;
  }
  .task.completed .title { text-decoration: line-through; }
  .task .due {
    font-size: 12px;
    color: var(--muted);
    margin-top: 3px;
  }
  .task .actions { display: flex; gap: 6px; flex-shrink: 0; }
  .badge {
    font-size: 10px;
    padding: 2px 6px;
    border-radius: 999px;
    background: var(--border);
    color: var(--muted);
    margin-left: 6px;
  }
  .empty { color: var(--muted); font-size: 13px; padding: 12px; }
  .badge.recur { background: rgba(91, 140, 255, 0.18); color: var(--accent); }
  #toasts {
    position: fixed;
    top: 16px;
    right: 16px;
    display: flex;
    flex-direction: column;
    gap: 8px;
    z-index: 10;
  }
  .toast {
    background: var(--panel);
    border: 1px solid var(--accent);
    border-radius: 10px;
    padding: 12px 14px;
    width: 280px;
    box-shadow: 0 8px 24px rgba(0, 0, 0, 0.35);
    display: flex;
    flex-direction: column;
    gap: 8px;
    animation: toast-in 0.15s ease-out;
  }
  .toast .title { font-size: 13px; font-weight: 600; }
  .toast .title::before { content: "⏰ "; }
  .toast .row { display: flex; gap: 6px; justify-content: flex-end; }
  @keyframes toast-in {
    from { opacity: 0; transform: translateY(-6px); }
    to { opacity: 1; transform: translateY(0); }
  }
</style>
</head>
<body>

<div id="toasts"></div>

<div class="panel chat-panel">
  <header>
    <span>
      <span id="bot-name">Custom To-Do Bot</span>
      <button class="ghost" id="rename">Rename</button>
    </span>
    <span class="sub">rule-based NLP · /chat</span>
  </header>
  <div class="examples" id="examples"></div>
  <div id="log"></div>
  <form id="chat-form">
    <input type="text" id="message" placeholder="Remind me to call Mom on Friday at 6 PM" autocomplete="off" />
    <button type="submit">Send</button>
  </form>
</div>

<div class="panel task-panel">
  <header>
    Tasks
    <button class="ghost" id="refresh">Refresh</button>
  </header>
  <div id="tasks"></div>
</div>

<script>
const log = document.getElementById("log");
const tasksEl = document.getElementById("tasks");
const form = document.getElementById("chat-form");
const input = document.getElementById("message");
const botNameEl = document.getElementById("bot-name");

const DEFAULT_BOT_NAME = "Custom To-Do Bot";

function loadSessionId() {
  try {
    let id = localStorage.getItem("sessionId");
    if (!id) {
      id = crypto.randomUUID();
      localStorage.setItem("sessionId", id);
    }
    return id;
  } catch {
    return crypto.randomUUID();
  }
}

const sessionId = loadSessionId();

function loadBotName() {
  try {
    return localStorage.getItem("botName") || DEFAULT_BOT_NAME;
  } catch {
    return DEFAULT_BOT_NAME;
  }
}

function applyBotName(name) {
  botNameEl.textContent = name;
  document.title = name;
  input.placeholder = `Message ${name}…`;
}

applyBotName(loadBotName());

document.getElementById("rename").addEventListener("click", () => {
  const next = prompt("What would you like to call me?", botNameEl.textContent);
  if (next === null) return;
  const name = next.trim() || DEFAULT_BOT_NAME;
  try {
    localStorage.setItem("botName", name);
  } catch {}
  applyBotName(name);
});

const EXAMPLES = [
  "Remind me to submit my resume tomorrow at 9 AM",
  "Remind me to call Mom on Friday at 6 PM",
  "Show my tasks",
  "Mark my resume task as completed",
  "Delete the mom task",
];

document.getElementById("examples").innerHTML = EXAMPLES
  .map(e => `<button type="button" data-msg="${e}">${e}</button>`)
  .join("");
document.getElementById("examples").addEventListener("click", (ev) => {
  const btn = ev.target.closest("button[data-msg]");
  if (!btn) return;
  input.value = btn.dataset.msg;
  form.requestSubmit();
});

function addMessage(text, who, intent) {
  const div = document.createElement("div");
  div.className = `msg ${who}`;
  div.textContent = text;
  if (intent) {
    const span = document.createElement("span");
    span.className = "intent";
    span.textContent = `intent: ${intent}`;
    div.appendChild(span);
  }
  log.appendChild(div);
  log.scrollTop = log.scrollHeight;
}

function fmtDue(due_at) {
  if (!due_at) return "no due date";
  const d = new Date(due_at);
  return d.toLocaleString(undefined, { weekday: "short", month: "short", day: "numeric", hour: "numeric", minute: "2-digit" });
}

function renderTasks(tasks) {
  if (!tasks.length) {
    tasksEl.innerHTML = '<div class="empty">No tasks yet — try the chat panel.</div>';
    return;
  }
  tasksEl.innerHTML = "";
  for (const t of tasks) {
    const row = document.createElement("div");
    row.className = `task ${t.status === "completed" ? "completed" : ""}`;
    row.innerHTML = `
      <div>
        <div class="title">${t.title}<span class="badge">${t.status}</span>${t.recurrence ? `<span class="badge recur">↻ ${t.recurrence}</span>` : ""}</div>
        <div class="due">${fmtDue(t.due_at)}</div>
      </div>
      <div class="actions">
        ${t.status !== "completed" ? `<button class="ghost" data-action="complete" data-id="${t.id}">Done</button>` : ""}
        <button class="ghost" data-action="delete" data-id="${t.id}">Delete</button>
      </div>
    `;
    tasksEl.appendChild(row);
  }
}

async function refreshTasks() {
  const res = await fetch("/tasks");
  const tasks = await res.json();
  renderTasks(tasks);
}

tasksEl.addEventListener("click", async (ev) => {
  const btn = ev.target.closest("button[data-action]");
  if (!btn) return;
  const id = btn.dataset.id;
  if (btn.dataset.action === "complete") {
    await fetch(`/tasks/${id}`, {
      method: "PATCH",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ status: "completed" }),
    });
  } else if (btn.dataset.action === "delete") {
    await fetch(`/tasks/${id}`, { method: "DELETE" });
  }
  refreshTasks();
});

document.getElementById("refresh").addEventListener("click", refreshTasks);

form.addEventListener("submit", async (ev) => {
  ev.preventDefault();
  const text = input.value.trim();
  if (!text) return;
  addMessage(text, "user");
  input.value = "";
  try {
    const res = await fetch("/chat", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ message: text, session_id: sessionId }),
    });
    const data = await res.json();
    addMessage(data.reply, "bot", data.intent);
  } catch (err) {
    addMessage("Error reaching the server: " + err.message, "bot");
  }
  refreshTasks();
});

const toastsEl = document.getElementById("toasts");
const shownReminderIds = new Set();

function showToast(task) {
  const el = document.createElement("div");
  el.className = "toast";
  el.innerHTML = `
    <div class="title">${task.title}</div>
    <div class="row">
      <button class="ghost" data-action="dismiss">Dismiss</button>
      <button data-action="done">Done</button>
    </div>
  `;
  el.querySelector('[data-action="dismiss"]').addEventListener("click", () => el.remove());
  el.querySelector('[data-action="done"]').addEventListener("click", async () => {
    await fetch(`/tasks/${task.id}`, {
      method: "PATCH",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ status: "completed" }),
    });
    el.remove();
    refreshTasks();
  });
  toastsEl.appendChild(el);
}

async function pollDueReminders() {
  try {
    const res = await fetch("/reminders/due");
    const due = await res.json();
    for (const task of due) {
      const key = `${task.id}:${task.due_at}`;
      if (shownReminderIds.has(key)) continue;
      shownReminderIds.add(key);
      showToast(task);
    }
  } catch {
    // Reminder polling is best-effort; a network hiccup shouldn't break the page.
  }
}

setInterval(pollDueReminders, 15000);
pollDueReminders();

refreshTasks();
</script>
</body>
</html>
