services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: sqlite:////app/data/todoweave.db
      HF_TOKEN: ${HF_TOKEN:-}
      HF_INTENT_MODEL: ${HF_INTENT_MODEL:-facebook/bart-large-mnli}
      HF_REPLY_ENABLED: ${HF_REPLY_ENABLED:-false}
      HF_REPLY_MODEL: ${HF_REPLY_MODEL:-google/gemma-2-2b-it:featherless-ai}
      HF_REPLY_FALLBACK_MODEL: ${HF_REPLY_FALLBACK_MODEL:-meta-llama/Llama-3.1-8B-Instruct:novita}
      APP_TIMEZONE: ${APP_TIMEZONE:-}
    volumes:
      - todoweave_data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  todoweave_data:
